rules:
  - id: summitflow-python-shell-execution
    languages: [python]
    severity: ERROR
    message: Use an argument vector; in ASGI paths, use the existing safe subprocess helper.
    paths:
      exclude:
        - backend/tests/**
    pattern-either:
      - pattern: subprocess.run(..., shell=True, ...)
      - pattern: subprocess.Popen(..., shell=True, ...)
      - pattern: subprocess.call(..., shell=True, ...)
      - pattern: subprocess.check_call(..., shell=True, ...)
      - pattern: subprocess.check_output(..., shell=True, ...)
      - pattern: asyncio.create_subprocess_shell(...)
  - id: summitflow-python-weak-cipher
    languages: [python]
    severity: ERROR
    message: CodeQL rejects ECB and legacy ciphers (py/weak-cryptographic-algorithm); use AES with CTR/GCM (a CTR keystream block gives AES_k(block)).
    pattern-either:
      - pattern: cryptography.hazmat.primitives.ciphers.modes.ECB(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.TripleDES(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.ARC4(...)
      - pattern: cryptography.hazmat.primitives.ciphers.algorithms.Blowfish(...)
