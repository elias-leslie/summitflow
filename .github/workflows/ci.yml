name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: summitflow_test
          POSTGRES_USER: summitflow_app
          POSTGRES_PASSWORD: ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summitflow_app -d summitflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://summitflow_app:ci-test@127.0.0.1:5432/summitflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Install age for backup encryption tests
        # Pinned release (matches Ubuntu 24.04's age 1.1.1) avoids a slow apt-get update.
        run: |
          curl -fsSL -o "$RUNNER_TEMP/age.tar.gz" https://github.com/FiloSottile/age/releases/download/v1.1.1/age-v1.1.1-linux-amd64.tar.gz
          echo "cf16cbb108fc56e2064b00ba2b65d9fb1b8d7002ca5e38260ee1cc34f6aaa8f9  $RUNNER_TEMP/age.tar.gz" | sha256sum -c -
          sudo tar -xzf "$RUNNER_TEMP/age.tar.gz" -C /usr/local/bin --strip-components=1 age/age age/age-keygen
      - name: Install backend dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint backend
        run: uv run ruff check .
      - name: Verify fresh schema and upgrade compatibility
        run: uv run python scripts/verify_bootstrap_schema.py
      - name: Test backend
        run: uv run pytest -n auto
      - name: Build backend package
        run: uv build

  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elias-leslie/agent-hub
          ref: e23acc82b89f01d974e93aac87f15fb399f2a812
          path: agent-hub-repo
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Pack Agent Hub workspace packages
        env:
          AGENT_HUB_ROOT: ${{ github.workspace }}/agent-hub-repo
        run: docker/scripts/pack-workspace-packages.sh docker/workspace-packages
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter summitflow-frontend lint
      - name: Typecheck frontend
        run: pnpm --filter summitflow-frontend exec tsc --noEmit
      - name: Test frontend
        run: pnpm --filter summitflow-frontend exec vitest run
      - name: Build frontend
        run: pnpm --filter summitflow-frontend build
