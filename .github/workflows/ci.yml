name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: summitflow_test
          POSTGRES_USER: summitflow_app
          POSTGRES_PASSWORD: ci-test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U summitflow_app -d summitflow_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DATABASE_URL: postgresql://summitflow_app:ci-test@127.0.0.1:5432/summitflow_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elias-leslie/agent-hub
          ref: e23acc82b89f01d974e93aac87f15fb399f2a812
          path: agent-hub-repo
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Build Agent Hub client wheel
        working-directory: agent-hub-repo/packages/agent-hub-client
        run: SOURCE_DATE_EPOCH=1577836800 uv build --wheel --out-dir "${{ github.workspace }}/docker/workspace-packages"
      - name: Install backend dependencies
        run: uv sync --locked --all-extras --dev
      - name: Lint backend
        run: uv run ruff check .
      - name: Verify fresh schema and upgrade compatibility
        run: uv run python scripts/verify_bootstrap_schema.py
      - name: Test backend
        run: uv run pytest
      - name: Build backend package
        run: uv build

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          repository: elias-leslie/agent-hub
          ref: e23acc82b89f01d974e93aac87f15fb399f2a812
          path: agent-hub-repo
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
      - name: Pack Agent Hub workspace packages
        env:
          AGENT_HUB_ROOT: ${{ github.workspace }}/agent-hub-repo
        run: docker/scripts/pack-workspace-packages.sh docker/workspace-packages
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Lint frontend
        run: pnpm --filter summitflow-frontend lint
      - name: Typecheck frontend
        run: pnpm --filter summitflow-frontend exec tsc --noEmit
      - name: Test frontend
        run: pnpm --filter summitflow-frontend exec vitest run
      - name: Build frontend
        run: pnpm --filter summitflow-frontend build
